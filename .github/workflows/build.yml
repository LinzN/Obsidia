name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Install libimobiledevice (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libirecovery
            mingw-w64-ucrt-x86_64-idevicerestore
            mingw-w64-ucrt-x86_64-ca-certificates

      - name: Collect files
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/tools
          cp target/release/obsidia.exe dist/
          for exe in idevice_id ideviceinfo ideviceenterrecovery idevicebackup2 irecovery idevicerestore; do
            # some packages ship the tool with a target prefix (x86_64-w64-mingw32-idevicerestore.exe)
            path=$(find /ucrt64/bin -iname "$exe.exe" | head -n1)
            [ -z "$path" ] && path=$(find /ucrt64/bin -iname "*-$exe.exe" | head -n1)
            if [ -z "$path" ]; then echo "::error::$exe.exe not found"; exit 1; fi
            cp "$path" "dist/tools/$exe.exe"
            ldd "$path" | awk '{print $3}' | grep -i '^/ucrt64/' | while read -r dll; do
              cp -n "$dll" dist/tools/ || true
            done
          done
          cp /ucrt64/etc/ssl/certs/ca-bundle.crt dist/tools/curl-ca-bundle.crt

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          wix build packaging\windows\obsidia.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$version" -d "Root=$PWD" -o "out\obsidia-$version-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build .dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          mkdir -p out
          packaging/macos/build-dmg.sh target/release/obsidia "$version" "out/obsidia-$version-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-ca-certificates

      # The packaged idevicerestore is too old for current devices and iOS
      # versions (Apple rejects its TSS requests), so build the whole stack
      # from the current sources.
      - name: Build libimobiledevice stack from source
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p /tmp/limd && cd /tmp/limd
          for repo in libplist libimobiledevice-glue libusbmuxd libtatsu libimobiledevice libirecovery idevicerestore; do
            echo "::group::$repo"
            git clone --quiet "https://github.com/libimobiledevice/$repo.git"
            cd "$repo"
            echo "$repo $(git describe --tags --always)" | tee -a /tmp/limd/versions.txt
            ./autogen.sh --prefix=/ucrt64 --without-cython --disable-static
            make -j"$(nproc)"
            make install
            cd ..
            echo "::endgroup::"
          done
          cat /tmp/limd/versions.txt

      - name: Collect files
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/tools
          cp target/release/obsidia.exe dist/
          for exe in idevice_id ideviceinfo ideviceenterrecovery idevicebackup2 irecovery idevicerestore; do
            # some packages ship the tool with a target prefix (x86_64-w64-mingw32-idevicerestore.exe)
            path=$(find /ucrt64/bin -iname "$exe.exe" | head -n1)
            [ -z "$path" ] && path=$(find /ucrt64/bin -iname "*-$exe.exe" | head -n1)
            if [ -z "$path" ]; then echo "::error::$exe.exe not found"; exit 1; fi
            cp "$path" "dist/tools/$exe.exe"
            ldd "$path" | awk '{print $3}' | grep -i '^/ucrt64/' | while read -r dll; do
              cp -n "$dll" dist/tools/ || true
            done
          done
          # libcurl from MSYS2 resolves its CA bundle relative to the DLL: <tools>/../etc/ssl/certs
          mkdir -p dist/etc/ssl/certs
          cp /ucrt64/etc/ssl/certs/ca-bundle.crt dist/etc/ssl/certs/ca-bundle.crt
          cp /tmp/limd/versions.txt dist/tools/VERSIONS.txt

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          wix build packaging\windows\obsidia.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$version" -d "Root=$PWD" -o "out\obsidia-$version-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi
          if-no-files-found: error

      # Microsoft Store package. It is uploaded unsigned to Partner Center,
      # the Store signs it after certification. Not part of the GitHub release.
      - name: Build MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'MirraNET.Obsidia' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=MirraNET' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'MirraNET' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $layout = "msix-layout"
          New-Item -ItemType Directory -Force $layout | Out-Null
          Copy-Item -Recurse dist\* $layout
          Copy-Item -Recurse packaging\windows\msix\Assets "$layout\Assets"
          Copy-Item LICENSE "$layout\LICENSE.txt"
          (Get-Content packaging\windows\msix\AppxManifest.xml -Raw) `
            -replace '\{IDENTITY_NAME\}', $env:IDENTITY_NAME `
            -replace '\{PUBLISHER\}', $env:PUBLISHER `
            -replace '\{PUBLISHER_DISPLAY_NAME\}', $env:PUBLISHER_DISPLAY_NAME `
            -replace '\{VERSION\}', $version |
            Set-Content -Encoding utf8 "$layout\AppxManifest.xml"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          New-Item -ItemType Directory -Force msix | Out-Null
          & $makeappx.FullName pack /d $layout /p "msix\obsidia-$version-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/*.msix
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build .dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          mkdir -p out
          packaging/macos/build-dmg.sh target/release/obsidia "$version" "out/obsidia-$version-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  release:
    # A tag `vX.Y.Z` (release.yml or scripts/release.sh) publishes a GitHub
    # release; Obsidia's updater finds it through the API.
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # only the installers, not the Store package
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux,macos}"
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Obsidia ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

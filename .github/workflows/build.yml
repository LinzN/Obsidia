name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-ca-certificates

      # The packaged idevicerestore is too old for current devices and iOS
      # versions (Apple rejects its TSS requests), so build the whole stack
      # from the current sources.
      - name: Build libimobiledevice stack from source
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p /tmp/limd && cd /tmp/limd
          for repo in libplist libimobiledevice-glue libusbmuxd libtatsu libimobiledevice libirecovery idevicerestore ideviceinstaller; do
            echo "::group::$repo"
            git clone --quiet "https://github.com/libimobiledevice/$repo.git"
            cd "$repo"
            echo "$repo $(git describe --tags --always)" | tee -a /tmp/limd/versions.txt
            ./autogen.sh --prefix=/ucrt64 --without-cython --disable-static
            make -j"$(nproc)"
            make install
            cd ..
            echo "::endgroup::"
          done
          cat /tmp/limd/versions.txt

      - name: Collect files
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/tools
          cp target/release/obsidia.exe dist/
          for exe in idevice_id ideviceinfo ideviceenterrecovery idevicebackup2 idevicediagnostics idevicesyslog idevicecrashreport idevicescreenshot afcclient ideviceinstaller irecovery idevicerestore; do
            # some packages ship the tool with a target prefix (x86_64-w64-mingw32-idevicerestore.exe)
            path=$(find /ucrt64/bin -iname "$exe.exe" | head -n1)
            [ -z "$path" ] && path=$(find /ucrt64/bin -iname "*-$exe.exe" | head -n1)
            if [ -z "$path" ]; then echo "::error::$exe.exe not found"; exit 1; fi
            cp "$path" "dist/tools/$exe.exe"
            ldd "$path" | awk '{print $3}' | grep -i '^/ucrt64/' | while read -r dll; do
              cp -n "$dll" dist/tools/ || true
            done
          done
          # libcurl from MSYS2 resolves its CA bundle relative to the DLL: <tools>/../etc/ssl/certs
          mkdir -p dist/etc/ssl/certs
          cp /ucrt64/etc/ssl/certs/ca-bundle.crt dist/etc/ssl/certs/ca-bundle.crt
          cp /tmp/limd/versions.txt dist/tools/VERSIONS.txt

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          wix build packaging\windows\obsidia.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$version" -d "Root=$PWD" -o "out\obsidia-$version-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi
          if-no-files-found: error

      # Microsoft Store package. It is uploaded unsigned to Partner Center,
      # the Store signs it after certification. Not part of the GitHub release.
      - name: Build MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'MirraNET.Obsidia' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=MirraNET' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'MirraNET' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $layout = "msix-layout"
          New-Item -ItemType Directory -Force $layout | Out-Null
          Copy-Item -Recurse dist\* $layout
          Copy-Item -Recurse packaging\windows\msix\Assets "$layout\Assets"
          Copy-Item LICENSE "$layout\LICENSE.txt"
          (Get-Content packaging\windows\msix\AppxManifest.xml -Raw) `
            -replace '\{IDENTITY_NAME\}', $env:IDENTITY_NAME `
            -replace '\{PUBLISHER\}', $env:PUBLISHER `
            -replace '\{PUBLISHER_DISPLAY_NAME\}', $env:PUBLISHER_DISPLAY_NAME `
            -replace '\{VERSION\}', $version |
            Set-Content -Encoding utf8 "$layout\AppxManifest.xml"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          # resources.pri lets Windows pick the icon size and the unplated
          # taskbar icons; without it the plated fallback icon is shown.
          $makepri = Join-Path $makeappx.DirectoryName "makepri.exe"
          & $makepri createconfig /cf priconfig.xml /dq en-US /o
          if ($LASTEXITCODE -ne 0) { throw "makepri createconfig failed" }
          & $makepri new /pr $layout /cf priconfig.xml /of "$layout\resources.pri" /mn "$layout\AppxManifest.xml" /o
          if ($LASTEXITCODE -ne 0) { throw "makepri new failed" }
          New-Item -ItemType Directory -Force msix | Out-Null
          & $makeappx.FullName pack /d $layout /p "msix\obsidia-$version-x64-store.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/*.msix
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build .dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          mkdir -p out
          packaging/macos/build-dmg.sh target/release/obsidia "$version" "out/obsidia-$version-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  release:
    # A tag `vX.Y.Z` (release.yml or scripts/release.sh) publishes a GitHub
    # release; Obsidia's updater finds it through the API.
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # installers plus the Store package (for upload to Partner Center)
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux,macos,msix-store}"
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Obsidia ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

  apt:
    # Publish the release .deb to the MirraNET APT repository (apt.mirranet.de).
    # reprepro and the signing key live on the server; skipped when the deploy
    # secrets are not configured.
    name: Publish to APT repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linux
          merge-multiple: true
      - name: Publish to APT repository
        env:
          APT_HOST: ${{ secrets.APT_HOST }}
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_KNOWN_HOSTS: ${{ secrets.APT_KNOWN_HOSTS }}
          APT_REPO: ${{ secrets.APT_REPO }}
          APT_PORT: ${{ secrets.APT_PORT }}
          APT_SUITE: stable
        run: |
          if [ -z "${APT_HOST:-}" ]; then
            echo "::notice::APT deploy secrets not set; skipping APT publish."
            exit 0
          fi
          mkdir -p debs
          find dist -name '*.deb' -exec cp {} debs/ \;
          if ! ls debs/*.deb >/dev/null 2>&1; then echo "::error::no .deb found in artifacts"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$APT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One shared connection (multiplexing) for all ssh/scp calls, so a flaky
          # connection setup only has to succeed once; retried with back-off.
          opt="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o Port=${APT_PORT:-22} -i $HOME/.ssh/id_deploy -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=300"
          connected=
          for attempt in 1 2 3 4 5 6; do
            if ssh $opt -fN "$APT_HOST"; then connected=1; break; fi
            echo "::warning::SSH connection to the APT server failed (attempt $attempt), retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          if [ -z "$connected" ]; then
            echo "::error::Could not connect to the APT server. Last attempt with debug output:"
            ssh -v $opt -o ControlMaster=no "$APT_HOST" true || true
            exit 1
          fi
          tmp=$(ssh $opt "$APT_HOST" mktemp -d)
          scp $opt -q packaging/apt/publish.sh debs/*.deb "$APT_HOST:$tmp/"
          rc=0
          ssh $opt "$APT_HOST" bash -s -- "$tmp" "$APT_REPO" "$APT_SUITE" <<'EOF' || rc=$?
          rc=0
          bash "$1/publish.sh" "$2" "$3" "$1"/*.deb || rc=$?
          rm -rf "$1"
          exit $rc
          EOF
          ssh $opt -O exit "$APT_HOST" 2>/dev/null || true
          exit $rc

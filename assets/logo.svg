<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Obsidia app icon: a faceted obsidian crystal on a graphite tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3139"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#60cdff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60cdff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fTL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a97ab"/>
      <stop offset="1" stop-color="#4a5466"/>
    </linearGradient>
    <linearGradient id="fTR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5668"/>
      <stop offset="1" stop-color="#2d333e"/>
    </linearGradient>
    <linearGradient id="fML" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#262b34"/>
    </linearGradient>
    <linearGradient id="fMR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1c2027"/>
      <stop offset="1" stop-color="#232831"/>
    </linearGradient>
    <linearGradient id="fBL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b33"/>
      <stop offset="1" stop-color="#191c22"/>
    </linearGradient>
    <linearGradient id="fBR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171b"/>
      <stop offset="1" stop-color="#1e2228"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe0ff"/>
      <stop offset="0.55" stop-color="#60cdff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60cdff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tileSheen)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

  <!-- crystal: T(256,92) UL(156,192) LL(156,318) B(256,420) LR(356,318) UR(356,192) C(256,226) -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="256,92 156,192 256,226" fill="url(#fTL)"/>
    <polygon points="256,92 356,192 256,226" fill="url(#fTR)"/>
    <polygon points="156,192 156,318 256,226" fill="url(#fML)"/>
    <polygon points="356,192 356,318 256,226" fill="url(#fMR)"/>
    <polygon points="156,318 256,420 256,226" fill="url(#fBL)"/>
    <polygon points="356,318 256,420 256,226" fill="url(#fBR)"/>
  </g>

  <!-- accent light along the upper left edges -->
  <polyline points="156,318 156,192 256,92" fill="none" stroke="url(#rim)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- faint top-right edge -->
  <line x1="256" y1="92" x2="356" y2="192" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"
        stroke-linecap="round"/>
</svg>
